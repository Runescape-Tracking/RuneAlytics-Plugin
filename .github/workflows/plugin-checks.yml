name: Plugin Hub Checks

# Catches RuneLite Plugin Hub convention violations (e.g. Thread.sleep, thread
# priority/interrupt, System.out, reflection, java.lang.Runtime, stray .class
# files) and compile errors on our own repo, so we find them before a
# plugin-hub reviewer does. Forbidden-API rules live in checkstyle.xml;
# Runtime bytecode + stray-.class guards live in scripts/plugin-hub-guards.sh.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Make scripts executable
        run: chmod +x ./gradlew scripts/make-submission.sh scripts/plugin-hub-guards.sh

      - name: Clear Gradle cache
        run: ./gradlew clean

      - name: Compile (fails on build breakage, like the plugin-hub build)
        run: ./gradlew --no-daemon compileJava

      - name: Plugin Hub guards (java/lang/Runtime + stray .class files)
        run: scripts/plugin-hub-guards.sh

      - name: Forbidden API / convention checks (main + test)
        run: ./gradlew --no-daemon checkstyleMain checkstyleTest

      # RuneAlyticsPluginTest is the GUI dev launcher (no @Test methods), so it
      # is skipped by test discovery and the unit tests run headless.
      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Upload checkstyle reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: checkstyle-reports
          path: build/reports/checkstyle/
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
